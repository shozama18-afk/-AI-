#        populate: null
#        rating_initial: 1500
#        rating_fixed: false
#        initial_weight: null
#        model_class: DummyInternalModel
#        model_config: {}

train_args:
    Learner:
        node_designation: null #127.0.0.1を指定してはいけない。
        num_gpus: 1 # MacOSの場合はrayがMPSをGPUとして認識しないので0にすること。ここで0にしてもPyTorchはMPSを認識するのでt.to('mps')のように利用可能。
        match_monitor_class: TwoTeamCombatMatchMonitor
        turn_based_training: false
        observation: false
        auto_tune_lr: false #本家HandyRLでは学習率はハードコーディングでスケジューリングされている。その有効/無効を切り替えるフラグ
        default_lr: 1.0e-4 #学習率の基準値。本家HandyRLのスケジューリングでは3e-8であり、これにバッチ中のデータ数を乗じて、更に重み更新回数に応じて減衰させている。
                           #スケジューリングを無効化した場合は何も乗じずこの値(省略時1e-4)をそのまま用いる。
        gamma: 0.997
        forward_steps: 64
        burn_in_steps: 16  # for RNNs
        compress_steps: 16
        entropy_regularization: 4.0e-3
        entropy_regularization_decay: 0.1
        separate_policy_gradients: false
        exploration_config:
            use_exploration: true
            only_one_explorer_per_policy: false
            eps_start: 0.4
            eps_end: 0.4
            eps_decay: -1
            alpha: 7.0
            cycle: 16
        checkpoint_interval: 10
        update_episodes: 10
        batch_size: 128
        minimum_episodes: 10
        epochs: -1
        num_batchers: 4
        auto_adjust_eval_rate: false #本家HandyRLのeval_rate補正を有効にするかどうか。trueにするとeval_rate < update_episode^(-0.15)の場合に後者の値が使用される。省略時はfalseとなる。
        eval_rate: 0.1 #auto_adjust_eval_rateをfalse(又は省略)として、実際のeval_rateを計算して直接指定することを推奨する。
        worker:
            num_parallel: 12
        lambda: 0.7
        policy_target: UPGO # 'UPGO' 'VTRACE' 'TD' 'MC'
        value_target: TD # 'VTRACE' 'TD' 'MC'
        seed: 0
        policy_to_train: Learner
        policy_to_imitate: [] # ["Expert"] #摸倣学習を実施する際は教師役のpolicy名を与える
        imitation_beta: 0.6
        imitation_kl_threshold: 1.0
        imitation_loss_scale: 1.0
        imitation_loss_threshold: 1.0
        deterministic:
            g: 0.1
            e: 0.1
        record_hidden_in: False # NNの内部状態をリプレイバッファに保存するか否か。メモリ消費量が激増するためFalseを推奨する。
        prioritized_replay: True # 優先度付き経験再生を有効化するかどうか。Falseの場合は本家HandyRLと同等のリプレイバッファ(DefaultReplayBuffer)となる。
        replay_buffer_config:
            node_designation: null
            independent_replay_for_each_player: True # 各player単位でリプレイバッファに記録するかどうか
            discard_untrainable_players: True # 学習対象以外のpolicyの情報を捨てるかどうか
            ignore_noaction_timesteps: True # 誰も行動していない時刻のデータを無視するかどうか(Falseの場合は空の時刻として残す)
            # ↓本家のReplayBuffer(DefaultReplayBuffer)
            maximum_episodes: 3000
            # ↓PrioritizedReplayBuffer
            calc_initial_priority: False
            priority_target: 'SAME' # 'VTRACE' 'TD' 'MC' 'SAME'
            capacity: 2000000
            alpha: 0.6
            beta: 0.4
            beta_decay: 6000000
            store_interval: 1
            eta: 0.9
            eps: 1.0e-8
        worker_options:
            num_cpus: 1.0

match_maker_args:
    match_maker_class: R8ContestTwoTeamCombatMatchMaker
    node_designation: null #127.0.0.1を指定してはいけない。
