# =====================================================================
# 初級セミナー用の学習設定 (オープン部門 / S方式: 1機に1エージェント)
#
# 使い方:
#     python tutorial/setup_workspace.py     # 作業ディレクトリを組み立てる
#     cd tutorial/workspace
#     python main.py seminar_config.yaml --train
#
# まず触るとよいのは以下の4箇所。
#   1. env_args.userModuleID       … 学習させるエージェントのディレクトリ
#   2. train_args.Learner.num_gpus … GPU が無い環境 / macOS(MPS) では 0 にする
#   3. train_args.Learner.epochs   … 学習の打ち切り。-1 は上限なし。試すときは 5 など
#   4. policy_config.Learner.model_config.use_lstm … まずは false のままでよい
#
# 詳細はドキュメントの
# 「HandyRLを用いた強化学習サンプル / yaml の記述方法」を参照。
# =====================================================================

save_dir: ./results/Open/Single

ray_args:
    namespace: ASRCAISim1
    head_ip_address: auto
    entrypoint_ip_address: 127.0.0.1 #ここを127.0.0.1として新規クラスタが生成された場合、別プロセスからのアクセスができなくなるらしい。
                                     #アクセス可能なクラスタを事前に立ち上げておくか、127.0.0.1以外のIPアドレスで指定する必要がある。この例は前者の想定。

env_args:
    # userModelID は Factory に "Agent_{userModelID}" というクラス名で登録される。
    # この名前と configs/seminar_learning_config_S.json の AgentConfigDispatcher の
    # "Learner_e" -> "model" の値を一致させる必要がある(既定では Agent_Sample)。
    userModelID: Sample
    # 学習させるエージェントのディレクトリ(__init__.py があるところ)
    userModuleID: RLAgent
    # 報酬を実装した .py のモジュール名。クラス名は MyReward 固定。
    userRewardModuleID: MyReward
    modelargs: args.json
    rewardConfig: reward_config.json
    # handyrl/environment.py の ENVS に無い名前はモジュールパスとして直接使われる。
    # SampleEnv/sample.py は ASRC/ASRCAISim1.py に Agent と Reward の
    # 動的登録処理を足したもので、setup_workspace.py が自動生成する。
    env: handyrl.envs.SampleEnv.sample

    env_config:
        config:
        - ./configs/R8_contest_open_mission_config.json
        - ./configs/R8_contest_open_asset_placeholder.json
        - ./configs/seminar_learning_config_S.json
        - ./configs/R8_contest_agent_ruler_reward_models.json
        # 公式サンプルの shaping 報酬(純Python版)の Factory 定義。
        # C++ をビルドしなくても使えるようにするため、教材側で定義している。
        - ./configs/seminar_reward_models.json
        - Manager:
            ViewerType: None
            Callbacks: {}
            Loggers: {}

policy_config:
    Learner:
        # S方式(1機に1エージェント)なので false。M方式では true にする。
        multi_port: false
        active_limit: 50
        is_internal: false
        populate:
            first_population: 1000
            interval: 1000
            on_start: false
        rating_initial: 1500
        rating_fixed: false
        initial_weight: null # /designate/your/weight/path/hoge.pth
        model_class: R8ContestTorchNNSampleForHandyRL
        model_config:
            actionDistributionClassGetter: actionDistributionClassGetter
            use_lstm: false
            lstm_cell_size: 256
            lstm_num_layers: 1
            lstm_dropout: 0.2
            # image:
            #     layers:
            #         - ["Conv2d",{"kernel_size": 7,"out_channels": 32,"padding": 3,"stride": 2}]
            #         - ["BatchNorm2d",{}]
            #         - ["ReLU",{}]
            #         - ["ResidualBlock",{
            #             "layers":[
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 32,"padding": 1}],
            #                 ["BatchNorm2d",{}],
            #                 ["ReLU",{}],
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 32,"padding": 1}],
            #                 ["BatchNorm2d",{}]
            #             ]}]
            #         - ["ReLU",{}]
            #         - ["Conv2d",{"kernel_size": 4,"out_channels": 64,"padding": 1,"stride": 2}]
            #         - ["BatchNorm2d",{}]
            #         - ["ReLU",{}]
            #         - ["ResidualBlock",{
            #             "layers":[
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 64,"padding": 1}],
            #                 ["BatchNorm2d",{}],
            #                 ["ReLU",{}],
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 64,"padding": 1}],
            #                 ["BatchNorm2d",{}]
            #             ]}]
            #         - ["ReLU",{}]
            #         - ["Conv2d",{"kernel_size": 4,"out_channels": 128,"padding": 1,"stride": 2}]
            #         - ["BatchNorm2d",{}]
            #         - ["ReLU",{}]
            #         - ["ResidualBlock",{
            #             "layers":[
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 128,"padding": 1}],
            #                 ["BatchNorm2d",{}],
            #                 ["ReLU",{}],
            #                 ["Conv2d",{"kernel_size": 3,"out_channels": 128,"padding": 1}],
            #                 ["BatchNorm2d",{}]
            #             ]}]
            #         - ["ReLU",{}]
            #         - ["AdaptiveAvgPool2d",{"output_size": 1}]
            #         - ["Flatten",{}]
            common:
                layers:
                    - ["Linear",{"out_features": 16}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 16}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 16}],
                            ["BatchNorm1d",{}]
                        ]}]
            parent:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            friend:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            enemy:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            enemy_2d:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            friend_missile:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            enemy_missile:
                layers:
                    - ["Linear",{"out_features": 32}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
                    - ["ReLU",{}]
                    - ["ResidualBlock",{
                        "layers":[
                            ["Linear",{"out_features": 32}],
                            ["BatchNorm1d",{}]
                        ]}]
            entity_equivariant:
                type: SetTransformer
                layers:
                    - ["ISAB",{"num_heads": 4,"num_inds": 16,"ln":true,"skip_rff":false}]
                    - ["ISAB",{"num_heads": 4,"num_inds": 16,"ln":true,"skip_rff":false}]
                #type: TransformerEncoder
                #layers:
                #    - ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
                #    - ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            entity_invariant:
                type: SetTransformer
                layers:
                    - ["ISAB",{"num_heads": 4,"num_inds": 16,"ln":true,"skip_rff":false}]
                    - ["PMA",{"num_heads": 4,"num_seeds": 1,"ln":true,"skip_rff":false}]
                #type: TransformerDecoder
                #layers:
                #    - ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
                #    - ["TransformerDecoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            merge:
                layers:
                    - ["ReLU",{}]
                    - ["Linear",{"out_features": 256}]
                    - ["ReLU",{}]
                    - ["Linear",{"out_features": 256}]
                    - ["ReLU",{}]
            # apply_merged_to_entity:
            #     #type: SetTransformerWithQuery
            #     #layers:
            #     #    - ["ISAB",{"num_heads": 4,"num_inds": 16,"ln":true,"skip_rff":false}]
            #     #    - ["ISAB",{"num_heads": 4,"num_inds": 16,"ln":true,"skip_rff":false}]
            #     #    - ["PMAWithQuery",{"num_heads": 4,"ln":true,"skip_rff":false}]
            #     type: TransformerDecoder
            #     layers:
            #         - ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            #         - ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            #         - ["TransformerDecoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            #         - ["TransformerDecoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
            critic:
                value: # 終了時の勝敗(±1)を割引率1で用いる本家HandyRL固有のcriticブランチ(NNにブランチを作らなければ無視される)
                    layers:
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                return: # 環境側の本来の即時報酬を、yamlで指定した割引率で用いる通常のcriticブランチ(NNにブランチを作らなければ無視される)
                    layers:
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
            actor:
                turn:
                    apply_mask: True
                    layers:
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                accel:
                    apply_mask: True
                    layers:
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                        - ["Linear",{"out_features": 32}]
                        - ["ReLU",{}]
                target:
                    apply_mask: True
                    type: TransformerDecoder
                    layers:
                        #- ["TransformerEncoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
                        - ["TransformerDecoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
                        - ["TransformerDecoderLayer",{"nhead": 4,"dim_feedforward": 16,"dropout": 0.1,"batch_first": true}]
    Initial:
        multi_port: false
        active_limit: null
        is_internal: true
        populate: null
        rating_initial: 1500
        rating_fixed: true
        initial_weight: null
        model_class: DummyInternalModel
        model_config: {}
# 模倣学習(Behavior cloning又はOffline RL)を実施する場合はコメントアウトを外す
# configs/seminar_learning_config_S.jsonにおいて、所望のExpertWrapperのalias名と一致していることを確認すること
#    Expert:
#        multi_port: false # S方式なのでfalse。M方式ではtrueにする。
#        active_limit: null
